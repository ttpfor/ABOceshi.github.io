<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABO 性格档案</title><style>
*{box-sizing:border-box}body{margin:0;background:#10121c;color:#f4efe7;font:16px/1.75 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:30px 20px 70px}header{letter-spacing:.18em;color:#e9c88d;border-bottom:1px solid #39384b;padding-bottom:16px}.panel{margin-top:32px;padding:clamp(20px,5vw,48px);border:1px solid #454055;border-radius:24px;background:radial-gradient(ellipse at top right,#332648,#1c1d2d 65%)}h1{font-size:clamp(32px,7vw,62px);line-height:1.16;margin:14px 0}h2{font-size:24px}h3{color:#e9c88d;margin-bottom:4px}p{margin-top:4px;color:#dfd8e6}button{font:inherit;color:inherit;background:#29253a;border:1px solid #5e526e;border-radius:12px;padding:10px 18px;cursor:pointer}button:hover,button:focus-visible{border-color:#f4cd88}button:disabled{opacity:.45;cursor:default}.primary{background:#e9c88d;color:#181522;border-color:#e9c88d;font-weight:700}.options{display:grid;gap:8px;margin:24px 0}.options button{text-align:left}.options button[aria-pressed=true]{background:#554160;border-color:#e9c88d}progress{width:100%;accent-color:#e9c88d}small,.eyebrow{color:#e9c88d}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.chips span{border:1px solid #5b506b;border-radius:30px;padding:4px 14px}section+section{border-top:1px solid #40384e}nav{display:flex;justify-content:space-between;gap:8px}</style>
<style>
:root{color-scheme:dark}body{background:#111426}.panel{background:radial-gradient(ellipse at top right,#352844,#1b2139 68%)}.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}.cover img{display:block;width:100%;border-radius:13px;border:1px solid #a98570}.intro h1{font-size:clamp(30px,5vw,52px)}.result{margin:26px 0;border:1px solid var(--role);border-radius:18px;overflow:hidden}.result-hero{display:flex;align-items:center;gap:22px;background:linear-gradient(115deg,color-mix(in srgb,var(--role) 25%,#18162a),#18182d);padding:16px 22px}.result-hero h2{color:var(--role);margin:8px 0;line-height:1.3}.portrait{width:clamp(78px,22vw,140px);max-height:280px;border-radius:8px;border:1px solid var(--role);background:#18182d}.result section{padding:10px 22px 20px}.result h3{color:var(--role)}.copy{color:#ebe4ed}.copy ul{padding-left:1.3em}.options span{color:#e9c88d}@media(max-width:570px){.cover{grid-template-columns:1fr}.cover img{width:min(100%,360px);margin:auto}.intro{text-align:center}.panel{margin-top:18px}.result section{padding-inline:14px}}
</style>
<style>.result-hero{position:relative;display:flex;align-items:end;min-height:clamp(280px,58vw,430px);isolation:isolate;padding:24px}.result-hero .portrait{position:absolute;inset:0;width:100%;height:100%;max-height:none;border:0;border-radius:0;z-index:-2}.result-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#10121cf5,transparent 72%);z-index:-1}.result-hero h2{font-size:clamp(26px,6vw,45px);text-shadow:0 2px 12px #111}.copy p{margin:8px 0;line-height:1.9}</style>
<style>.result-hero{background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--role) 30%,#17182a),#141524 75%)}.result-hero:before{background:linear-gradient(0deg,#10121c 2%,#10121c99 24%,transparent 53%)}.result-hero .portrait{background:transparent}.extras{margin:24px 0;padding:16px;border:1px solid #514762;border-radius:18px}.extras h2{text-align:center;margin:6px 0}.radar{display:block;width:100%;max-width:480px;margin:auto}.radar polygon,.radar line{fill:none;stroke:#615675;stroke-width:1}.radar .shape{fill:#d98bd355;stroke:#f6a7e9;stroke-width:2}.radar circle{fill:#ed99d1;stroke:#fff0fa;stroke-width:1.5}.radar text{fill:#f6edf8;font-size:13px}.extras-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.extras-grid>div{padding:12px;background:#17192c;border-radius:10px}@media(max-width:520px){.extras-grid{grid-template-columns:1fr}.extras{padding:8px}.result-hero{padding:16px}.result-hero .portrait{height:88%}}</style>
<style id="portrait-extension">.result-hero{overflow:hidden;min-height:0;aspect-ratio:16/9}.result-hero .portrait{display:block;height:100%;object-fit:cover;object-position:center;background:transparent}.result-hero:before{background:linear-gradient(90deg,#10121cb8,transparent 65%),linear-gradient(0deg,#10121ce8,transparent 52%)}.extras-grid p{line-height:1.8}@media(max-width:520px){.result-hero{padding:12px}.result-hero h2{font-size:clamp(16px,5vw,24px)}.result-hero p{margin-bottom:0}}</style>
<style>@media(max-width:600px){#app > progress + h2{font-size:clamp(17px,4.6vw,19px);line-height:1.5;font-weight:650;margin:18px 0 12px}}</style><main><header>✦ ABO / 性格档案</header><div id="app" class="panel"></div><p><small>娱乐向角色测试 · 答案在当前页面计算</small></p></main>
<script src="quiz.js"></script></html>
