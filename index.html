<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABO 六型 60 题 · 大白话版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234D613C' d='M12 2a10 10 0 1 0 10 10 8 8 0 0 1-10-10z'/%3E%3C/svg%3E">
<style>
:root{
  --pink:#F1BBC9;
  --pink-deep:#e292ab;
  --pink-soft:#f6cfd9;
  --pink-bg:#fceef2;
  --green:#4D613C;
  --green-deep:#39492b;
  --green-soft:#71855f;
  --green-bg:#eef1e7;
  --beta:#a8a08c;
  --beta-deep:#8a8371;
  --ink:#2b3126;
  --ink-soft:#5b6053;
  --paper:#faf7f0;
  --line:rgba(75,97,60,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  color:var(--ink);background:var(--paper);line-height:1.6;
  min-height:100vh;
}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

/* ===== 视图容器 ===== */
.view{display:none}
.view.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 开始页 ===== */
.cover{position:relative;color:#fff;border-radius:0 0 30px 30px;overflow:hidden;
  background:linear-gradient(120deg,#f6cfd9 0%,#f1bbc9 30%,#e7aabb 46%,#5a7050 58%,#4D613C 100%);}
.cover::before{content:"";position:absolute;inset:0;
  background:radial-gradient(70% 60% at 18% 0%,rgba(255,255,255,.34),transparent 60%),
             radial-gradient(60% 55% at 86% 100%,rgba(255,255,255,.14),transparent 60%);}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.blob.p{width:230px;height:230px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.5),rgba(246,207,217,.05));top:-50px;right:-55px}
.blob.g{width:210px;height:210px;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.22),rgba(113,133,95,.05));bottom:-62px;left:-48px}
.blob.s{width:110px;height:110px;background:rgba(255,255,255,.15);top:128px;left:-26px;filter:blur(2px)}
.deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.b{position:absolute;border-radius:50%;background:rgba(255,255,255,.32)}
.b1{width:14px;height:14px;top:16%;left:11%}
.b2{width:8px;height:8px;top:30%;right:15%;background:rgba(255,233,196,.55)}
.b3{width:20px;height:20px;bottom:24%;left:9%;background:rgba(246,207,217,.55)}
.b4{width:10px;height:10px;bottom:30%;right:9%}
.b5{width:6px;height:6px;top:46%;left:22%}
.b6{width:12px;height:12px;top:14%;right:29%;background:rgba(113,133,95,.45)}
.b7{width:7px;height:7px;bottom:16%;right:22%;background:rgba(255,233,196,.5)}
.st{position:absolute;fill:#fff;opacity:.9}
.s1{width:16px;height:16px;top:22%;right:21%}
.s2{width:10px;height:10px;bottom:36%;left:16%}
.s3{width:12px;height:12px;top:52%;right:7%}
.arc{position:absolute;border:1.5px solid rgba(255,255,255,.28);border-radius:50%;border-bottom-color:transparent;border-left-color:transparent}
.a1{width:210px;height:210px;top:-70px;right:-50px;transform:rotate(35deg)}
.a2{width:150px;height:150px;bottom:-50px;left:-40px;transform:rotate(-20deg)}
.cover-inner{position:relative;padding:52px 22px 44px;text-align:center;z-index:1}
.emblem{width:104px;height:104px;margin:0 auto 18px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),rgba(255,255,255,.05));
  border:1.5px solid rgba(255,255,255,.5);
  box-shadow:0 10px 30px rgba(43,49,38,.25), inset 0 0 0 6px rgba(255,255,255,.08)}
.emblem svg{width:100%;height:100%;display:block}
.cover h1{font-size:42px;line-height:1.05;font-weight:800;letter-spacing:.01em;margin:0;
  text-shadow:0 3px 16px rgba(43,49,38,.26)}
.cover h1 .hl{color:#ffe9c4;text-shadow:0 2px 10px rgba(255,233,196,.4)}
.sub{display:flex;align-items:center;justify-content:center;gap:14px;font-size:15px;
  color:rgba(255,255,255,.93);font-weight:500;margin:12px auto 0}
.sub .line{width:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8))}
.sub .line:last-child{background:linear-gradient(90deg,rgba(255,255,255,.8),transparent)}
.lead{margin:22px 0 4px;color:rgba(255,255,255,.95);font-size:15px;line-height:1.8}
.attrs{display:flex;justify-content:center;align-items:flex-end;gap:32px;margin:26px 0 22px}
.attr{display:flex;flex-direction:column;align-items:center;gap:8px}
.attr .ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.42);backdrop-filter:blur(3px);
  box-shadow:0 4px 12px rgba(43,49,38,.15)}
.attr span{font-size:12px;color:rgba(255,255,255,.85);letter-spacing:.08em;font-weight:600}
.pills{display:flex;justify-content:center;gap:10px;margin:2px 0 26px;flex-wrap:wrap}
.pill{padding:8px 16px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(3px)}
.pill b{font-weight:800;font-size:16px}
.btn-start{display:inline-block;padding:15px 46px;border-radius:999px;font-size:17px;font-weight:700;
  background:#fff;color:var(--green-deep);box-shadow:0 10px 24px rgba(43,49,38,.28);
  transition:transform .12s ease}
.btn-start:active{transform:scale(.97)}
.cover-foot{margin-top:20px;font-size:12px;color:rgba(255,255,255,.75)}

/* ===== 答题页 ===== */
#view-quiz{min-height:100vh;position:relative;
  background:linear-gradient(155deg,#f8d7e0 0%,#fceef2 20%,#faf7f0 45%,#e8ede0 75%,#d4dcc8 100%);}
#view-quiz::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(400px 300px at 15% 10%,rgba(241,187,201,.45),transparent 70%),
    radial-gradient(350px 280px at 90% 90%,rgba(77,97,60,.25),transparent 70%),
    radial-gradient(250px 200px at 80% 15%,rgba(246,207,217,.3),transparent 70%),
    radial-gradient(200px 180px at 10% 85%,rgba(113,133,95,.15),transparent 70%);}
.quiz-deco{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.quiz-deco .blob{position:absolute;border-radius:50%;filter:blur(40px)}
.quiz-deco .blob1{width:200px;height:200px;background:rgba(241,187,201,.35);top:-60px;right:-50px}
.quiz-deco .blob2{width:180px;height:180px;background:rgba(113,133,95,.2);bottom:-50px;left:-40px}
.quiz-deco .dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.7)}
.quiz-deco .dot1{width:10px;height:10px;top:15%;left:8%}
.quiz-deco .dot2{width:6px;height:6px;top:25%;right:12%;background:rgba(241,187,201,.6)}
.quiz-deco .dot3{width:14px;height:14px;bottom:20%;left:10%;background:rgba(113,133,95,.25)}
.quiz-deco .dot4{width:8px;height:8px;bottom:30%;right:8%;background:rgba(255,233,196,.7)}
.quiz-deco .dot5{width:5px;height:5px;top:50%;left:5%}
.quiz-deco .arc{position:absolute;border:1.5px solid rgba(77,97,60,.15);border-radius:50%;border-bottom-color:transparent;border-left-color:transparent}
.quiz-deco .arc1{width:160px;height:160px;top:-50px;right:-40px;transform:rotate(30deg)}
.quiz-deco .arc2{width:120px;height:120px;bottom:-40px;left:-30px;transform:rotate(-20deg);border-color:rgba(241,187,201,.25);border-bottom-color:transparent;border-left-color:transparent}
.quiz-deco .star{position:absolute;color:rgba(255,255,255,.8)}
.quiz-deco .star1{width:12px;height:12px;top:18%;right:20%}
.quiz-deco .star2{width:8px;height:8px;bottom:25%;left:18%}
.quiz-top{display:flex;align-items:center;gap:14px;padding:20px 0 12px;position:relative;z-index:1}
.quiz-back{width:40px;height:40px;border-radius:50%;background:var(--green-bg);color:var(--green-deep);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.progress{flex:1}
.progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px}
.bar{height:8px;border-radius:99px;background:var(--green-bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--green));transition:width .25s ease}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 20px;margin-top:8px;
  box-shadow:0 8px 32px rgba(75,97,60,.12),0 2px 8px rgba(75,97,60,.06);position:relative;z-index:1}
.qno{font-size:13px;font-weight:700;color:var(--pink-deep);letter-spacing:.08em;margin-bottom:10px}
.qtext{font-size:19px;font-weight:700;line-height:1.5;margin-bottom:20px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;
  transition:border-color .12s ease,background .12s ease}
.opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#fff;background:var(--green);margin-top:1px}
.opt[data-k="B"] .key{background:var(--beta)}
.opt[data-k="C"] .key{background:var(--pink-deep)}
.opt[data-k="D"] .key{background:#6fa3c9}
.opt .t{font-size:15px;line-height:1.55;min-width:0}
.opt:active{background:var(--pink-bg)}
.opt.sel{border-color:var(--green);background:var(--green-bg)}

/* ===== 结果页 ===== */
.result-hero{position:relative;overflow:hidden;border-radius:0 0 28px 28px;padding:34px 22px 30px;color:#fff;text-align:center;
  background:var(--green);transition:background .3s}
.result-hero.is-pink{background:var(--pink)}
.result-hero.is-beta{background:var(--beta)}
.r-deco{position:absolute;inset:0;pointer-events:none}
.r-deco .rb{position:absolute;border-radius:50%;background:rgba(255,255,255,.25)}
.r-deco .rb1{width:60px;height:60px;top:-20px;right:-20px}
.r-deco .rb2{width:40px;height:40px;bottom:-15px;left:-15px;background:rgba(255,255,255,.15)}
.r-deco .rb3{width:12px;height:12px;top:20%;right:30%}
.r-deco .rb4{width:8px;height:8px;bottom:25%;left:25%}
.r-emblem{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45),rgba(255,255,255,.05));
  border:1.5px solid rgba(255,255,255,.5);
  box-shadow:0 6px 18px rgba(0,0,0,.15)}
.r-emblem svg{width:100%;height:100%}
.rtype{font-size:13px;letter-spacing:.16em;color:rgba(255,255,255,.85);font-weight:700;margin-bottom:6px;position:relative;z-index:1}
.rtitle{font-size:30px;font-weight:800;line-height:1.25;position:relative;z-index:1}
.rtitle small{display:block;font-size:14px;font-weight:600;color:rgba(255,255,255,.9);margin-top:6px;letter-spacing:.05em}
.result-body{padding:26px 20px 48px;position:relative;z-index:1}
.type-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 20px;margin-top:18px;
  box-shadow:0 4px 16px rgba(75,97,60,.06)}
.type-card h3{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.type-card h3::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--green)}
.type-card.is-pink h3::before{background:var(--pink-deep)}
.type-card.is-beta h3::before{background:var(--beta-deep)}
.seg{margin-bottom:14px}
.seg h4{font-size:14px;font-weight:700;color:var(--green-deep);margin-bottom:5px}
.seg h4.is-pink{color:var(--pink-deep)}
.seg p{font-size:15px;color:var(--ink);line-height:1.75}
.note{margin-top:22px;background:var(--green-bg);border:1px solid var(--line);border-radius:22px;padding:22px 20px}
.note.is-pink{background:var(--pink-bg)}
.note h3{font-size:17px;font-weight:800;margin-bottom:10px}
.note p{font-size:14.5px;color:var(--ink);line-height:1.8;margin-bottom:8px}
.note .tag{display:inline-block;margin:10px 6px 0 0;padding:6px 13px;border-radius:99px;font-size:13px;font-weight:700;
  color:#fff;background:var(--green)}
.note.is-pink .tag{background:var(--pink-deep)}
.note.is-beta .tag{background:var(--beta-deep)}
.result-foot{text-align:center;margin-top:26px}
.btn-again{display:inline-block;padding:14px 42px;border-radius:999px;font-weight:700;font-size:15px;
  color:#fff;background:var(--green);box-shadow:0 8px 20px rgba(75,97,60,.28)}
.btn-again:active{transform:scale(.97)}

footer{padding:26px 20px 40px;text-align:center;font-size:12px;color:var(--ink-soft)}
@media (max-width:480px){
  .cover h1{font-size:33px}
}
</style>
</head>
<body>

<!-- ================= 视图：开始 ================= -->
<section id="view-start" class="view">
  <div class="cover">
    <div class="blob p"></div><div class="blob g"></div><div class="blob s"></div>
    <div class="deco" aria-hidden="true">
      <span class="b b1"></span><span class="b b2"></span><span class="b b3"></span>
      <span class="b b4"></span><span class="b b5"></span><span class="b b6"></span><span class="b b7"></span>
      <svg class="st s1" viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
      <svg class="st s2" viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
      <svg class="st s3" viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>

      </div>
      <h1>ABO 六型 <span class="hl">· 60 题</span></h1>
      <div class="sub"><span class="line"></span>测出你心底最真实的那一种性格原型<span class="line"></span></div>

      <div class="attrs">
        <div class="attr"><div class="ic"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3l2.2 4.9 5.3.6-3.9 3.7 1 5.3-4.6-2.6L7.4 17.5l1-5.3L4.5 8.5l5.3-.6z" fill="rgba(255,255,255,.95)"/></svg></div><span>强势</span></div>

      </div>
      <div class="pills">
        <div class="pill"><b>60</b> 道题</div>
        <div class="pill"><b>6</b> 种性格</div>
        <div class="pill">约 <b>5</b> 分钟</div>
      </div>
      <button class="btn-start" data-goto="quiz">开始测试</button>
      <div class="cover-foot">测完直接出你的性格结果</div>
    </div>
  </div>
  <footer>本测试为娱乐向性格类比 · 图个开心就好</footer>
</section>

<!-- ================= 视图：答题 ================= -->
<section id="view-quiz" class="view">
  <div class="quiz-deco" aria-hidden="true">
    <div class="blob blob1"></div><div class="blob blob2"></div>
    <span class="dot dot1"></span><span class="dot dot2"></span><span class="dot dot3"></span>
    <span class="dot dot4"></span><span class="dot dot5"></span>
    <span class="arc arc1"></span><span class="arc arc2"></span>

  <div class="wrap">

<!-- ================= 视图：结果 ================= -->
<section id="view-result" class="view">
  <div class="result-hero" id="result-hero">

      <span class="rb rb1"></span><span class="rb rb2"></span><span class="rb rb3"></span><span class="rb rb4"></span>

        <path d="M37 54 A18 18 0 0 1 63 54" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.2" stroke-linecap="round"/>

<script>
/* ================= 题目数据（60 题，大白话版） ================= */
const QUESTIONS=[
{q:"一群人吵成一团，没人拿主意，你会？",a:"站出来定方案，给大家分工",b:"先观望，等别人定好，我配合执行",c:"盼着有人出来稳住局面，我跟着就行",d:"悄悄单独劝说，缓和大家火气"},
{q:"遇到气场很强、压迫感很重的人，你的本能感受？",a:"不服气，敢于对等硬碰",b:"没什么特别感觉，正常相处",c:"心里发慌发软，想躲开或者找安心的依靠",d:"提高警惕，但不会正面硬刚"},

/* ================= 状态与逻辑 ================= */
const views={start:document.getElementById("view-start"),quiz:document.getElementById("view-quiz"),result:document.getElementById("view-result")};
let answers=[];let cur=0;

function show(name){
  Object.keys(views).forEach(k=>views[k].classList.toggle("active",k===name));
  if(name==="result"){location.hash="result"}
}
function goTo(name){
  if(name==="quiz"&&!answers.length){cur=0;answers=[];renderQuiz()}
  show(name);
  window.scrollTo(0,0);
}

/* 答题渲染 */
function renderQuiz(){
  const item=QUESTIONS[cur];
  document.getElementById("q-no").textContent="Q"+(cur+1);
  document.getElementById("q-text").textContent=item.q;
  const box=document.getElementById("q-opts");
  box.innerHTML="";
  [["a","A"],["b","B"],["c","C"],["d","D"]].forEach(([k,letter])=>{
    const btn=document.createElement("button");
    btn.className="opt";btn.dataset.k=letter;
    btn.innerHTML='<span class="key">'+letter+'</span><span class="t">'+item[k]+'</span>';
    if(answers[cur]===letter)btn.classList.add("sel");
    btn.addEventListener("click",()=>pick(letter));
    box.appendChild(btn);
  });
  const done=cur+1;
  document.getElementById("p-num").textContent="第 "+done+" / 60 题";
  document.getElementById("p-pct").textContent=Math.round(done/60*100)+"%";
  document.getElementById("p-bar").style.width=(done/60*100)+"%";
}
function pick(letter){
  answers[cur]=letter;
  const btns=document.querySelectorAll("#q-opts .opt");
  btns.forEach(b=>b.classList.toggle("sel",b.dataset.k===letter));
  if(cur<QUESTIONS.length-1){cur++;renderQuiz();window.scrollTo(0,0);}
  else finish();
}

/* 计分与结果 */
function finish(){
  const c={A:0,B:0,C:0,D:0};
  answers.forEach(a=>{if(a)c[a]++});
  const secondMax=Math.max(c.A,c.B,c.C);
  const second= c.A===secondMax?"A":(c.B===secondMax?"B":"O");
  const gender= c.D>=15?"男":"女";
  const key=gender+second;
  renderResult(key,c);
  show("result");
}
function renderResult(key,c){
  const T=TYPES[key];
  const hero=document.getElementById("result-hero");
  hero.classList.remove("is-pink","is-beta");
  if(T.accent==="pink")hero.classList.add("is-pink");
  if(T.accent==="beta")hero.classList.add("is-beta");
  document.getElementById("r-type").textContent="你的性格原型是";
  document.getElementById("r-title").innerHTML=T.title+'<small>'+T.gender+' · '+T.sec+' 型</small><small style="margin-top:10px;font-size:13px;opacity:.85">'+T.shortTag+'</small>';

  const card=document.getElementById("r-card");
  card.classList.remove("is-pink","is-beta");
  if(T.accent==="pink")card.classList.add("is-pink");
  if(T.accent==="beta")card.classList.add("is-beta");
  card.innerHTML='<h3>'+T.title+'</h3>'+
    '<div class="seg" style="margin-bottom:14px;padding:14px 16px;background:var(--green-bg);border-radius:14px"><p style="font-size:15px;line-height:1.75">'+T.insight+'</p></div>'+
    '<div class="seg" style="margin-bottom:18px;padding:14px 16px;background:var(--pink-bg);border-radius:14px"><p style="font-size:14.5px;line-height:1.7;color:var(--ink-soft)"><b style="color:var(--pink-deep)">'+T.genderReason.split("？")[0]+'？</b>'+T.genderReason.split("？")[1]+'</p></div>'+
    T.segs.map(s=>'<div class="seg"><h4>'+s.h+'</h4><p>'+s.p+'</p></div>').join("")+
    '<div class="seg" style="margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)"><h4 style="color:var(--pink-deep)">和另一性别版本的区别</h4><p>'+T.diff+'</p></div>';

  const note=document.getElementById("r-note");
  note.classList.remove("is-pink","is-beta");
  if(T.accent==="pink")note.classList.add("is-pink");
  if(T.accent==="beta")note.classList.add("is-beta");
  note.innerHTML='<h3>【ABO 科普小注解】</h3>'+
   '<p>ABO 设定最早来自网络同人圈的虚构世界观（也叫 Omegaverse）：它给真实的人叠加一层“第二性别”——Alpha、Beta、Omega，再配上男／女这种“第一性别”。</p>'+
   '<p><b>Alpha</b> 是天生的强者：气场足、有领导力、保护欲和占有欲都很强，像人群里的头狼；<b>Beta</b> 是安稳踏实的大多数：情绪稳定、不争不抢、靠谱抗造，是身边的定心丸；<b>Omega</b> 温柔敏感、共情力强，容易心动，渴望被爱和被保护。</p>'+
   '<p>这套测试把你的答案汇总，用最突出的一组倾向比出你的”第二性别”（'+T.sec+'），再结合”性别倾向”（'+T.gender+'），组合出 6 种类型。</p>'+
   '<p><b>你测出来的性格，对应的就是 ABO 里的</b></p>'+
   '<span class="tag">'+T.tag+' · '+T.title+'</span>'+
   '<p style="margin-top:12px">当然，这只是娱乐向的性格类比，用来帮你更了解自己的本能倾向，不代表真实的生物学——图个开心就好。</p>';
}

/* 顶部返回与重测按钮 */
document.querySelectorAll("[data-goto]").forEach(b=>{
  b.addEventListener("click",()=>goTo(b.dataset.goto));
});
/* 答题页返回：保留已答进度 */
const backBtn=document.querySelector(".quiz-back");
backBtn.addEventListener("click",()=>{if(cur>0){cur--;renderQuiz()}else{goTo("start")}});

/* 初始 */
if(location.hash==="#result"){show("result")}else{show("start")}
</script>
